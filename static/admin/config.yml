backend:
  name: git-gateway
  branch: main
  
publish_mode: editorial_workflow

site_url: https://sunseasangria.com

media_folder: assets/images
public_folder: /images

collections:
  - name: "series"
    label: "Series"
    folder: "content/series"
    path: "{{slug}}/_index"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false
        hint: "Main image shown at the top of the series page"
      - label: "Display Order (Weight)"
        name: "weight"
        widget: "number"
        default: 0
        value_type: "int"
        min: 0
        required: false
        hint: "Controls where this series appears: top 3 by weight show as homepage cards; also drives the blog filter and series nav order. Lower numbers appear first (e.g. 10, 20, 30). Leave as 0 to hide from homepage cards and sort alphabetically in filters."
      - label: "Menu Weight (leave empty to hide from menu)"
        name: "menu_weight"
        widget: "number"
        required: false
        hint: "Home=10, Blog=20. Set 30+ to appear after Blog."
      - label: "Nav Card Emoji"
        name: "nav_emoji"
        widget: "string"
        required: false
        hint: "Emoji shown on the homepage Explore card (e.g. 📰, 🎉, 📚)"
      - label: "Nav Card Description"
        name: "nav_desc"
        widget: "string"
        required: false
        hint: "Short description shown on the homepage Explore card"
      - label: "Nav Card Colour"
        name: "nav_color"
        widget: "string"
        required: false
        hint: "Hex colour for the card accent (e.g. #e67e22)"
      - { label: "Body", name: "body", widget: "markdown", hint: "Introduction to this series" }

  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Description", name: "description", widget: "string", required: false }
      # value_field resolves to "<folder>/_index" because the series collection's
      # path is "{{slug}}/_index". A preSave hook in admin.js strips the trailing
      # "/_index" so posts store the bare folder slug = Hugo's taxonomy key.
      # Keep that hook if you touch this relation.
      - label: "Series"
        name: "series"
        widget: "relation"
        collection: "series"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        required: false
        hint: "Optionally assign this blog to a series"
      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false
        hint: "Thumbnail shown on the blog listing page (optional — series emoji used if empty)"
      - { label: "Comments", name: "comments", widget: "boolean", default: false, required: false, hint: "Enable the comment section on this post" }
      - { label: "Socials", name: "socials", widget: "boolean", default: false, required: false, hint: "Show the social links bar at the end of this post" }
      - { label: "Show in Popular Blogs", name: "popular", widget: "boolean", default: false, required: false, hint: "Feature this post in the 'Popular Blogs' sidebar on the blog page (newest featured posts appear first)" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    folder: "content"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - label: "Menu Weight (leave empty to hide from menu, lower numbers appear first)"
        name: "menu_weight"
        widget: "number"
        required: false
        hint: "Home=10, Blog=20. Set 30+ to appear after Blog."
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Site Settings"
    delete: false
    editor: { preview: false }
    files:
      - name: "homepage"
        label: "Homepage"
        file: "data/homepage.yaml"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - label: "Background images"
                label_singular: "Image"
                name: "images"
                widget: "list"
                min: 1
                collapsed: false
                field: { label: "Image", name: "image", widget: "image" }
                hint: "Add up to 4 or 5 photos and they'll fade from one to the next automatically. Drag the rows to reorder — the top one shows first. Just one image = no slideshow, it stays still."
              - { label: "Seconds each image stays on screen", name: "interval", widget: "number", default: 6,
                  value_type: "int", min: 2, max: 30, required: false,
                  hint: "Only used when there's more than one image. 6 is a good default." }
              - { label: "Small italic line above headline", name: "eyebrow", widget: "string" }
              - { label: "Big headline", name: "headline", widget: "text",
                  hint: "Press Enter to add a line break (e.g. break after 'the')" }
              - { label: "Button label", name: "cta_label", widget: "string" }
              - { label: "Button link", name: "cta_link", widget: "string",
                  hint: "Use #latest to scroll to the latest posts, or any URL" }
          - label: "Newsletter callout"
            name: "newsletter"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Description", name: "body", widget: "text" }
              - { label: "Button label", name: "cta_label", widget: "string" }
              - { label: "Substack URL", name: "url", widget: "string" }

      - name: "blogpage"
        label: "Blog Page"
        file: "data/blogpage.yaml"
        fields:
          - { label: "Title", name: "title", widget: "string", hint: "Main heading at the top of the blog listing page" }
          - { label: "Subtitle", name: "subtitle", widget: "string", required: false, hint: "Optional tagline shown under the title (a 🍹 is added automatically). Leave empty for no subtitle." }

      # Free-form panels down the right-hand side of the homepage. Add, reorder
      # or remove them freely — the field names must stay in step with
      # layouts/partials/aside-panel.html.
      - name: "homepanels"
        label: "Homepage Panels"
        file: "data/homepanels.yaml"
        fields:
          - label: "Panels"
            label_singular: "Panel"
            name: "panels"
            widget: "list"
            collapsed: false
            summary: "{{fields.heading}}"
            required: false
            hint: "The boxes down the right-hand side of the homepage. Drag the rows to reorder — the top one shows first. Every field is optional, so a panel can be just a picture, just text, or any mix."
            fields:
              - { label: "Show this panel", name: "visible", widget: "boolean", default: true, required: false, hint: "Turn off to hide this panel without deleting it" }
              - { label: "Heading", name: "heading", widget: "string", required: false, hint: "Title shown at the top of the panel — also the name of this row in the list above" }
              - { label: "Image", name: "image", widget: "image", required: false, hint: "Optional image shown above the text" }
              - { label: "Text", name: "body", widget: "markdown", required: false, hint: "Write whatever you like here — appears under the image" }
              - { label: "Link label", name: "link_label", widget: "string", required: false, hint: "Optional link text, e.g. 'Read more' (leave empty for no link)" }
              - { label: "Link URL", name: "link_url", widget: "string", required: false, hint: "Where the link goes, e.g. /shop/ (only used if a link label is set)" }

      - name: "socials"
        label: "Social Media URLs"
        file: "data/socials.yaml"
        fields:
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Pinterest", name: "pinterest", widget: "string", required: false }
          - { label: "Facebook",  name: "facebook",  widget: "string", required: false }
          - { label: "YouTube",   name: "youtube",   widget: "string", required: false }
          - { label: "X",         name: "x",         widget: "string", required: false }
          - { label: "TikTok",    name: "tiktok",    widget: "string", required: false, hint: "Full profile URL, e.g. https://www.tiktok.com/@sunseasangria — leave empty to hide the icon" }
