backend:
  name: git-gateway
  branch: main
  
publish_mode: editorial_workflow

site_url: https://sunseasangria.com

media_folder: assets/images
public_folder: /images

collections:
  - name: "series"
    label: "Story Series"
    folder: "content/series"
    path: "{{slug}}/_index"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Series ID", name: "series_id", widget: "hidden", default: "" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false
        hint: "Main image shown at the top of the series page"
      - label: "Display Order (Weight)"
        name: "weight"
        widget: "number"
        default: 0
        value_type: "int"
        min: 0
        required: false
        hint: "Controls the order this series appears in filters and navigation. Lower numbers appear first (e.g. 10, 20, 30). Leave as 0 to sort alphabetically after all weighted series."
      - label: "Menu Weight (leave empty to hide from menu)"
        name: "menu_weight"
        widget: "number"
        required: false
        hint: "Home=10, Blog=20. Set 30+ to appear after Blog."
      - label: "Nav Card Emoji"
        name: "nav_emoji"
        widget: "string"
        required: false
        hint: "Emoji shown on the homepage Explore card (e.g. 📰, 🎉, 📚)"
      - label: "Nav Card Description"
        name: "nav_desc"
        widget: "string"
        required: false
        hint: "Short description shown on the homepage Explore card"
      - label: "Nav Card Colour"
        name: "nav_color"
        widget: "string"
        required: false
        hint: "Hex colour for the card accent (e.g. #e67e22)"
      - label: "Nav Card Order"
        name: "nav_weight"
        widget: "number"
        required: false
        hint: "Controls display order on homepage (lower numbers appear first)"
      - { label: "Body", name: "body", widget: "markdown", hint: "Introduction to this story series" }

  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Description", name: "description", widget: "string", required: false }
      - label: "Series"
        name: "series"
        widget: "relation"
        collection: "series"
        search_fields: ["title"]
        value_field: "{{fields.series_id}}"
        display_fields: ["title"]
        required: false
        hint: "Optionally assign this post to a story series"
      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false
        hint: "Thumbnail shown on the blog listing page (optional — series emoji used if empty)"
      - { label: "Comments", name: "comments", widget: "boolean", default: false, required: false, hint: "Enable the comment section on this post" }
      - { label: "Socials", name: "socials", widget: "boolean", default: false, required: false, hint: "Show the social links bar at the end of this post" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    folder: "content"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - label: "Menu Weight (leave empty to hide from menu, lower numbers appear first)"
        name: "menu_weight"
        widget: "number"
        required: false
        hint: "Home=10, Blog=20. Set 30+ to appear after Blog."
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Site Settings"
    delete: false
    editor: { preview: false }
    files:
      - name: "homepage"
        label: "Homepage"
        file: "data/homepage.yaml"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Background image", name: "image", widget: "image" }
              - { label: "Small italic line above headline", name: "eyebrow", widget: "string" }
              - { label: "Big headline", name: "headline", widget: "text",
                  hint: "Press Enter to add a line break (e.g. break after 'the')" }
              - { label: "Button label", name: "cta_label", widget: "string" }
              - { label: "Button link", name: "cta_link", widget: "string",
                  hint: "Use #latest to scroll to the latest posts, or any URL" }
          - label: "Newsletter callout"
            name: "newsletter"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Description", name: "body", widget: "text" }
              - { label: "Button label", name: "cta_label", widget: "string" }
              - { label: "Substack URL", name: "url", widget: "string" }

      - name: "socials"
        label: "Social Media URLs"
        file: "data/socials.yaml"
        fields:
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Pinterest", name: "pinterest", widget: "string", required: false }
          - { label: "Facebook",  name: "facebook",  widget: "string", required: false }
          - { label: "YouTube",   name: "youtube",   widget: "string", required: false }
          - { label: "X",         name: "x",         widget: "string", required: false }
