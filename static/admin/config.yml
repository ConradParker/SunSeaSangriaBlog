backend:
  name: git-gateway
  branch: main
  
publish_mode: editorial_workflow

site_url: https://sunseasangria.com

media_folder: assets/images
public_folder: /images

collections:
  - name: "series"
    label: "Story Series"
    folder: "content/series"
    path: "{{slug}}/_index"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false
        hint: "Main image shown at the top of the series page"
      - label: "Display Order (Weight)"
        name: "weight"
        widget: "number"
        default: 0
        value_type: "int"
        min: 0
        required: false
        hint: "Controls where this series appears: top 3 by weight show as homepage cards; also drives the blog filter and series nav order. Lower numbers appear first (e.g. 10, 20, 30). Leave as 0 to hide from homepage cards and sort alphabetically in filters."
      - label: "Menu Weight (leave empty to hide from menu)"
        name: "menu_weight"
        widget: "number"
        required: false
        hint: "Home=10, Blog=20. Set 30+ to appear after Blog."
      - label: "Nav Card Emoji"
        name: "nav_emoji"
        widget: "string"
        required: false
        hint: "Emoji shown on the homepage Explore card (e.g. 📰, 🎉, 📚)"
      - label: "Nav Card Description"
        name: "nav_desc"
        widget: "string"
        required: false
        hint: "Short description shown on the homepage Explore card"
      - label: "Nav Card Colour"
        name: "nav_color"
        widget: "string"
        required: false
        hint: "Hex colour for the card accent (e.g. #e67e22)"
      - { label: "Body", name: "body", widget: "markdown", hint: "Introduction to this story series" }

  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Description", name: "description", widget: "string", required: false }
      # value_field resolves to "<folder>/_index" because the series collection's
      # path is "{{slug}}/_index". A preSave hook in admin.js strips the trailing
      # "/_index" so posts store the bare folder slug = Hugo's taxonomy key.
      # Keep that hook if you touch this relation.
      - label: "Series"
        name: "series"
        widget: "relation"
        collection: "series"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        required: false
        hint: "Optionally assign this post to a story series"
      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false
        hint: "Thumbnail shown on the blog listing page (optional — series emoji used if empty)"
      - { label: "Comments", name: "comments", widget: "boolean", default: false, required: false, hint: "Enable the comment section on this post" }
      - { label: "Socials", name: "socials", widget: "boolean", default: false, required: false, hint: "Show the social links bar at the end of this post" }
      - { label: "Show in Popular Blogs", name: "popular", widget: "boolean", default: false, required: false, hint: "Feature this post in the 'Popular Blogs' sidebar on the blog page (newest featured posts appear first)" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    folder: "content"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - label: "Menu Weight (leave empty to hide from menu, lower numbers appear first)"
        name: "menu_weight"
        widget: "number"
        required: false
        hint: "Home=10, Blog=20. Set 30+ to appear after Blog."
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Site Settings"
    delete: false
    editor: { preview: false }
    files:
      - name: "homepage"
        label: "Homepage"
        file: "data/homepage.yaml"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Background image", name: "image", widget: "image" }
              - { label: "Small italic line above headline", name: "eyebrow", widget: "string" }
              - { label: "Big headline", name: "headline", widget: "text",
                  hint: "Press Enter to add a line break (e.g. break after 'the')" }
              - { label: "Button label", name: "cta_label", widget: "string" }
              - { label: "Button link", name: "cta_link", widget: "string",
                  hint: "Use #latest to scroll to the latest posts, or any URL" }
          - label: "Newsletter callout"
            name: "newsletter"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Description", name: "body", widget: "text" }
              - { label: "Button label", name: "cta_label", widget: "string" }
              - { label: "Substack URL", name: "url", widget: "string" }

      - name: "blogpage"
        label: "Blog Page"
        file: "data/blogpage.yaml"
        fields:
          - { label: "Title", name: "title", widget: "string", hint: "Main heading at the top of the blog listing page" }
          - { label: "Subtitle", name: "subtitle", widget: "string", required: false, hint: "Optional tagline shown under the title (a 🍹 is added automatically). Leave empty for no subtitle." }

      - name: "featuredstory"
        label: "Featured Story"
        file: "data/featuredstory.yaml"
        fields:
          - { label: "Heading", name: "heading", widget: "string", default: "Featured Story", hint: "Title shown at the top of the Featured Story panel on the homepage" }
          - { label: "Image", name: "image", widget: "image", required: false, hint: "Optional image shown above the text" }
          - { label: "Text", name: "body", widget: "markdown", required: false, hint: "Write whatever you like here — appears under the image" }
          - { label: "Link label", name: "link_label", widget: "string", required: false, hint: "Optional link text, e.g. 'Read more' (leave empty for no link)" }
          - { label: "Link URL", name: "link_url", widget: "string", required: false, hint: "Where the link goes (only used if a link label is set)" }

      - name: "socials"
        label: "Social Media URLs"
        file: "data/socials.yaml"
        fields:
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Pinterest", name: "pinterest", widget: "string", required: false }
          - { label: "Facebook",  name: "facebook",  widget: "string", required: false }
          - { label: "YouTube",   name: "youtube",   widget: "string", required: false }
          - { label: "X",         name: "x",         widget: "string", required: false }
