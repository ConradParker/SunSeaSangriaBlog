backend:
  name: git-gateway
  branch: main

site_url: https://sunseasangriablog.netlify.app

media_folder: assets/images
public_folder: /images

collections:
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    folder: "content"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - label: "Menu"
        name: "menu"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - label: "Main Menu"
            name: "main"
            widget: "object"
            required: false
            fields:
              - { label: "Weight (lower = first)", name: "weight", widget: "number", default: 100, required: false }
      - { label: "Body", name: "body", widget: "markdown" }
