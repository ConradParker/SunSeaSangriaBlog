# Must be absolute: sitemap <loc>, canonical and og:url are built from it.
# Netlify preview/branch builds override it with -b $DEPLOY_PRIME_URL.
baseURL = 'https://sunseasangria.com/'
enableRobotsTXT = true
languageCode = 'en-us'
title = 'Sun Sea Sangria'
theme = 'paige'
copyright = '© 2025 Sun Sea Sangria. All rights reserved.'

# resources.GetRemote (homepage YouTube feed) caches forever by default, which
# would freeze the feed in local dev. Netlify builds start with no cache.
[caches.getresource]
  dir = ":cacheDir/:project"
  maxAge = "1h"

# Paige registers application/atom+xml with suffix "xml", which makes Hugo's
# GetRemote fail to resolve ANY remote XML ("failed to resolve media type") —
# that broke the homepage YouTube feed. The site doesn't emit Atom (feeds are
# rss.xml via application/rss+xml), so moving Atom off "xml" is safe.
[mediaTypes."application/atom+xml"]
  suffixes = ["atom"]

[taxonomies]
  series = "series"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  logo = "/images/sunseasangria-logo.jpeg"
  logoAlt = "Sun Sea Sangria"

[params.paige.site]
  disable_breadcrumbs = true
  disable_credit = true

# Top-level static pages (About, Contact, Shop, legal...) share the default
# single layout with blog posts, so Paige would stamp them with a date, word
# count and reading time. Turn that off for root-level pages only; blog posts
# under /blog/ are unaffected. Description stays in <meta> but isn't repeated
# as a lead paragraph under the H1.
[[cascade]]
  [cascade.params.paige.pages]
    disable_date = true
    disable_word_count = true
    disable_reading_time = true
    disable_description = true
  [cascade.target]
    kind = "page"
    path = "/*"

# Blog has no editable content page with `menu_weight`, so it lives here.
# Everything else is driven by the `menu_weight` field on each page or series
# (set via the CMS). There's deliberately no Home item: the logo links home.
[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 20

