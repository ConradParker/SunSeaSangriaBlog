baseURL = '/'
languageCode = 'en-us'
title = 'Sun Sea Sangria'
theme = 'paige'
copyright = '© 2025 Sun Sea Sangria. All rights reserved.'

[taxonomies]
  series = "series"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  logo = "/images/sunseasangria-logo.jpeg"
  logoAlt = "Sun Sea Sangria"

[params.paige.site]
  disable_breadcrumbs = true
  disable_credit = true

# Top-level static pages (About, Contact, Shop, legal...) share the default
# single layout with blog posts, so Paige would stamp them with a date, word
# count and reading time. Turn that off for root-level pages only; blog posts
# under /blog/ are unaffected. Description stays in <meta> but isn't repeated
# as a lead paragraph under the H1.
[[cascade]]
  [cascade.params.paige.pages]
    disable_date = true
    disable_word_count = true
    disable_reading_time = true
    disable_description = true
  [cascade.target]
    kind = "page"
    path = "/*"

# Home and Blog have no editable content pages with `menu_weight`, so they
# live here. Everything else is driven by the `menu_weight` field on each
# page or series (set via the CMS).
[[menu.main]]
  name = "Home"
  url = "/"
  weight = 10

[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 20

