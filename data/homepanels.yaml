  - visible: true
    heading: Featured on the Terrace
    image: /images/image_89b1b00c.jpg
    body: >-
      Got your favourable residency resolution and wondering what happens next?
      Pull up a lounger; this plain-English, 6-page printable guide walks you
      step-by-step through getting your physical TIE card in Alicante province
      without the usual Spanish bureaucracy headaches. **Inside the free
      guide:**


      * **The new 2026 Alicante rules:** How the automatic SMS/email appointment pilot works (and when to stop waiting and book it yourself).

      * **How to book your *cita previa*:** Exact dropdown options to pick so you don't accidentally book the wrong appointment.

      * **The complete document checklist:** Every form, fee receipt (Modelo 790-012), photo size, and copy you need to bring on the day.

      * **Costa Blanca North tips:** Real-life advice from the terrace on station differences, collection receipts, and avoiding common mistakes.
    link_label: Free 2026 TIE Fingerprint Survival Guide (Costa Blanca North & Alicante)
    link_url: https://drive.google.com/file/d/166H3Mo6D10I7kdXS6NMTMHKEyL1IO-Ut/view?usp=drive_link
  - visible: true
    image: /images/img_8392.jpeg
    body: >-
      **Snoopy’s book is out now**


      **Paws & Mischief: Tales of a Tale Wagging Troublemaker** is on Amazon. The tiny Andalucía rescue, the helicopter tail, the bus stop, the mountain- all in one place for children and anyone who shared a house with a small dog.


      [Chapter 1 is still here for free ](https://sunseasangria.com/blog/2026-01-15-the-great-puddle-mystery-snoopys-first-day/)
